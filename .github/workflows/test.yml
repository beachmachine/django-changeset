name: Linter and tests
on: [push, pull_request]

jobs:
  build-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        django-version: ['5.2', '6.0']
        exclude:
          - python-version: '3.10'
            django-version: '6.0'
          - python-version: '3.11'
            django-version: '6.0'

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit codecov

      - name: Lint with pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Install Django ${{ matrix.django-version }}
        run: pip install django==${{ matrix.django-version }}

      - name: Install package and dependencies
        run: pip install -e .

      - name: Run tests
        run: |
          # prepare Django application
          ln -s ./tests/test_project/test_project test_project
          ln -s ./tests/test_project/manage.py manage.py

          # run tests with coverage
          coverage run \
            --source='./django_changeset' \
            --omit='./anexia_monitoring/migrations/*' \
            manage.py test
          coverage xml

      - name: Upload coverage to Codecov
        if: ${{ !env.ACT }}
        uses: codecov/codecov-action@v1

  build-django:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: '3.10'
            django-version: '5.2'
          - python-version: '3.11'
            django-version: '5.2'
          - python-version: '3.12'
            django-version: '5.2'
          - python-version: '3.13'
            django-version: '5.2'
          - python-version: '3.12'
            django-version: '6.0'
          - python-version: '3.13'
            django-version: '6.0'
          - python-version: '3.14'
            django-version: '6.0'

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit codecov

      - name: Lint with pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Install Django ${{ matrix.django-version }}
        run: pip install django==${{ matrix.django-version }}

      - name: Install matching django-userforeignkey dependency
        run: |
          pip install "django-userforeignkey>=0.6.1"

      - name: Install package and dependencies
        run: pip install -e . --no-deps

      - name: Run tests
        run: |
          # prepare Django application
          ln -s ./tests/test_project/test_project test_project
          ln -s ./tests/test_project/manage.py manage.py

          # run tests with coverage
          coverage run \
            --source='./django_changeset' \
            --omit='./anexia_monitoring/migrations/*' \
            manage.py test
          coverage xml

      - name: Upload coverage to Codecov
        if: ${{ !env.ACT }}
        uses: codecov/codecov-action@v1
